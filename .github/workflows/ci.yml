name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Verify public repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify policy contract
        run: node --test .github/scripts/public-repository-contract.test.mjs
  test:
    name: Test action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Nushell
        uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: 0.115.1
      - name: Checkout NuTest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vyadh/nutest
          ref: c46af12bc6e3819b95d69f54f35526ca3e5810d6
          path: nutest
          persist-credentials: false
      - name: Install NuTest module
        run: |
          mkdir -p "$HOME/.config/nushell/lib"
          cp -R nutest/nutest "$HOME/.config/nushell/lib/nutest"
      - name: Run action tests
        shell: nu {0}
        run: |
          use nutest *
          use ${{ github.workspace }}/nu/util.nu [prepare-awk]
          prepare-awk
          nutest run-tests --fail --display terminal
