name: Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify a future release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Nushell
        uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: 0.115.1
      - name: Checkout NuTest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vyadh/nutest
          ref: c46af12bc6e3819b95d69f54f35526ca3e5810d6
          path: nutest-source
          persist-credentials: false
      - name: Install NuTest module in the workspace
        run: |
          cp -R nutest-source/nutest nutest
      - name: Verify action tests
        shell: nu {0}
        run: |
          use ${{ github.workspace }}/nutest/mod.nu [run-tests]
          use ${{ github.workspace }}/nu/util.nu [prepare-awk]
          prepare-awk
          run-tests --path ${{ github.workspace }}/tests --fail --display terminal
      - name: Verify action metadata
        run: node --test .github/scripts/public-repository-contract.test.mjs
